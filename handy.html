<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glücksrad Fernbedienung 📱</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        h1 {
            margin-bottom: 2rem;
            font-size: 1.5rem;
            color: #94a3b8;
        }
        .btn-remote {
            background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            color: white;
            border: none;
            padding: 2rem 3rem;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.5);
            width: 100%;
            max-width: 350px;
            text-transform: uppercase;
        }
        .btn-remote:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>Fernbedienung</h1>
    <button id="remoteSpinBtn" class="btn-remote">Rad Drehen 🚀</button>

    <script>
        const socket = io();

        const spinBtn = document.getElementById('remoteSpinBtn');
        spinBtn.addEventListener('click', () => {
            // Signal an den Node.js Server senden
            socket.emit('remote_spin');
        });
    </script>

</body>
</html>
