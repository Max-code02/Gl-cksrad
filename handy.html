<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glücksrad PRO Master-Control 📱</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #131b2e;
            --bg-input: #1c263f;
            --border-color: #263354;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            --accent-target: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            --accent-warning: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            padding-bottom: 3rem;
        }
        .header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .header-badges {
            display: flex;
            gap: 0.4rem;
            align-items: center;
        }
        h1 {
            font-size: 1.1rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .status-badge {
            font-size: 0.75rem;
            padding: 0.3rem 0.6rem;
            border-radius: 20px;
            font-weight: 700;
            background: rgba(244, 63, 94, 0.2);
            color: #f43f5e;
            border: 1px solid rgba(244, 63, 94, 0.4);
        }
        .status-badge.online {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }
        .room-badge {
            font-size: 0.75rem;
            padding: 0.3rem 0.6rem;
            border-radius: 20px;
            font-weight: 700;
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.4);
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .room-badge:active {
            transform: scale(0.95);
        }
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* BANNER FÜR NÄCHSTEN PC DREH */
        .trap-status-card {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 16px;
            padding: 0.8rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }
        .trap-status-card.active {
            background: rgba(245, 158, 11, 0.2);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
        }
        .trap-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }
        .trap-label {
            font-size: 0.75rem;
            color: #fbbf24;
            font-weight: 700;
            text-transform: uppercase;
        }
        .trap-value {
            font-size: 0.95rem;
            font-weight: 800;
            color: #ffffff;
        }
        .btn-clear-trap {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 0.4rem 0.7rem;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* BUTTONS */
        .btn-group-main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }
        .btn-action {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 1rem 0.5rem;
            font-size: 0.95rem;
            font-weight: 800;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 8px 20px -5px rgba(236, 72, 153, 0.3);
            text-align: center;
            transition: transform 0.1s ease;
        }
        .btn-action.weighted {
            background: var(--accent-target);
            box-shadow: 0 8px 20px -5px rgba(16, 185, 129, 0.3);
        }
        .btn-action:active {
            transform: scale(0.96);
        }

        /* SECTION CARDS */
        .section-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.1rem;
        }
        .section-title {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--text-secondary);
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* OPTIONS LIST & WEIGHT SLIDERS */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 45vh;
            overflow-y: auto;
            padding-right: 2px;
        }
        .option-card {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .option-card.armed-trap {
            border-color: #f59e0b !important;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.25);
            background: rgba(30, 41, 69, 0.9);
        }
        .option-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .option-title-text {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
        }
        .chance-badge {
            font-size: 0.75rem;
            font-weight: 800;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
        }
        .weight-controls {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .weight-slider {
            flex: 1;
            accent-color: #6366f1;
            height: 6px;
            background: #0f172a;
            border-radius: 3px;
        }
        .weight-num {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            min-width: 35px;
            text-align: right;
        }
        .option-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 0.2rem;
        }
        .btn-sub-trigger {
            background: #223052;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.5rem;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }
        .btn-sub-trigger:active {
            background: #334155;
        }
        .btn-sub-trigger.trap-btn {
            border-color: rgba(245, 158, 11, 0.5);
            color: #fbbf24;
        }

        /* PRESET BUTTONS */
        .preset-bar {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }
        .btn-preset {
            flex: 1;
            min-width: 21%;
            background: #1c263f;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.4rem;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }
        .btn-preset:active {
            background: #283556;
            color: #ffffff;
        }

        /* SFX GRID */
        .sfx-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }
        .btn-sfx {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.6rem 0.2rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: transform 0.1s;
        }
        .btn-sfx:active {
            transform: scale(0.92);
            background: #2b3859;
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: #10b981;
            color: white;
            padding: 0.7rem 1.4rem;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.85rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 1000;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🕵️ Glücksrad PRO</h1>
        <div class="header-badges">
            <div id="roomBadge" class="room-badge" onclick="changeRoom()" title="Raum wechseln">Raum: --</div>
            <div id="statusBadge" class="status-badge">Verbinde...</div>
        </div>
    </div>

    <div class="container">
        
        <!-- STATUS DER MAIN-WHEEL FALLES -->
        <div id="trapCard" class="trap-status-card">
            <div class="trap-info">
                <span class="trap-label">🎯 Nächster PC-Klick ist eingestellt auf:</span>
                <span id="trapDisplay" class="trap-value">🎲 Echter Zufall</span>
            </div>
            <button id="clearTrapBtn" class="btn-clear-trap" style="display: none;">Reset</button>
        </div>

        <!-- SCHNELL-DREH BUTTONS -->
        <div class="btn-group-main">
            <button id="randomSpinBtn" class="btn-action">🎲 100% Zufall</button>
            <button id="weightedSpinBtn" class="btn-action weighted">⚖️ Gewichtet Drehen</button>
        </div>

        <!-- MANIPULATIONS- UND CHANCEN-STEUERUNG -->
        <div class="section-card">
            <div class="section-title">
                <span>⚙️ Optionen & Gewinnchancen</span>
                <span id="itemCount" style="font-size: 0.8rem; color: #818cf8;">0 Optionen</span>
            </div>

            <div class="preset-bar">
                <button class="btn-preset" onclick="setAllWeights(50)">Alle 50w</button>
                <button class="btn-preset" onclick="setAllWeights(100)">Alle 100w</button>
                <button class="btn-preset" onclick="lockFirstOption()">Ziel 1 = 0%</button>
                <button class="btn-preset" onclick="forceFirstOption()">Ziel 1 = 100%</button>
                <button class="btn-preset" onclick="randomizeWeights()">🎲 Chaos</button>
            </div>

            <div id="optionsList" class="options-grid">
                <div style="text-align: center; color: var(--text-secondary); padding: 1.5rem;">
                    Lade Optionen vom Glücksrad...
                </div>
            </div>
        </div>

        <!-- LIVE SOUND & EFFEKTE STEUERUNG -->
        <div class="section-card">
            <div class="section-title">
                <span>🔊 Live Effekte an PC senden</span>
            </div>
            <div class="sfx-grid">
                <button class="btn-sfx" onclick="triggerEffect('confetti')">🎉 Konfetti</button>
                <button class="btn-sfx" onclick="triggerEffect('cheer')">👏 Applaus</button>
                <button class="btn-sfx" onclick="triggerEffect('drumroll')">🥁 Wirbel</button>
                <button class="btn-sfx" onclick="triggerEffect('fail')">💥 Drama</button>
            </div>
        </div>

    </div>

    <div id="toast" class="toast">Befehl gesendet! 🚀</div>

    <script>
        // --- RAUM MANAGEMENT LOGIK ---
        let roomName = localStorage.getItem('profi_wheel_room');
        if (!roomName) {
            let input = prompt("Bitte gib einen Raum-Namen ein:");
            if (input && input.trim() !== "") {
                roomName = input.trim().toLowerCase();
                localStorage.setItem('profi_wheel_room', roomName);
            } else {
                roomName = "standard-raum";
            }
        }

        const roomBadge = document.getElementById('roomBadge');
        roomBadge.textContent = `📍 ${roomName}`;

        function changeRoom() {
            let newRoom = prompt("Neuen Raum-Namen eingeben:");
            if (newRoom && newRoom.trim() !== "") {
                roomName = newRoom.trim().toLowerCase();
                localStorage.setItem('profi_wheel_room', roomName);
                roomBadge.textContent = `📍 ${roomName}`;
                showToast(`Raum gewechselt zu: ${roomName}`);
                
                // Erneut beim Raum anmelden
                socket.emit('join_room', roomName);
                socket.emit('request_sync', { room: roomName });
            }
        }

        // Socket Verbindungsaufbau
        const socket = io();
        const statusBadge = document.getElementById('statusBadge');
        const randomSpinBtn = document.getElementById('randomSpinBtn');
        const weightedSpinBtn = document.getElementById('weightedSpinBtn');
        const optionsList = document.getElementById('optionsList');
        const itemCount = document.getElementById('itemCount');
        const trapDisplay = document.getElementById('trapDisplay');
        const trapCard = document.getElementById('trapCard');
        const clearTrapBtn = document.getElementById('clearTrapBtn');
        const toast = document.getElementById('toast');

        let currentOptions = [];
        let optionWeights = []; // Speichert die versteckten Gewichte (0-100)
        let forcedMainTarget = null; // Speichert das Manipulationsziel für den PC-Klick

        // Socket Events
        socket.on('connect', () => {
            statusBadge.textContent = 'Verbunden 🟢';
            statusBadge.classList.add('online');
            
            // Mit Raum-Kontext verbinden
            socket.emit('join_room', roomName);
            socket.emit('request_sync', { room: roomName });
        });

        socket.on('disconnect', () => {
            statusBadge.textContent = 'Getrennt 🔴';
            statusBadge.classList.remove('online');
        });

        socket.on('init_state', (data) => {
            if (data && data.options) syncOptions(data.options);
        });

        socket.on('update_options', (data) => {
            if (data && data.options) syncOptions(data.options);
        });

        // Empfange Signal wenn am PC gedreht wurde (um Falle zu leeren)
        socket.on('wheel_spun_on_pc', () => {
            clearMainTrap();
        });

        function syncOptions(options) {
            currentOptions = options;
            // Falls neue Optionen hinzukommen, Gewichte initialisieren (Standard 50)
            while (optionWeights.length < currentOptions.length) {
                optionWeights.push(50);
            }
            optionWeights = optionWeights.slice(0, currentOptions.length);
            renderOptionsUI();
        }

        // Berechnet die echten Prozentchancen basierend auf allen Gewichten
        function renderOptionsUI() {
            itemCount.textContent = `${currentOptions.length} Optionen`;
            optionsList.innerHTML = '';

            if (currentOptions.length === 0) {
                optionsList.innerHTML = `<div style="text-align: center; color: var(--text-secondary); padding: 1.5rem;">Keine Optionen geladen.</div>`;
                return;
            }

            const totalWeight = optionWeights.reduce((a, b) => a + b, 0);

            currentOptions.forEach((opt, index) => {
                const weight = optionWeights[index];
                const chance = totalWeight > 0 ? ((weight / totalWeight) * 100).toFixed(1) : 0;
                const isArmed = (forcedMainTarget === index);

                const card = document.createElement('div');
                card.className = `option-card ${isArmed ? 'armed-trap' : ''}`;
                card.innerHTML = `
                    <div class="option-header">
                        <span class="option-title-text">#${index + 1} ${opt}</span>
                        <span class="chance-badge">${chance}% Chance</span>
                    </div>
                    <div class="weight-controls">
                        <input type="range" class="weight-slider" min="0" max="100" value="${weight}" oninput="updateWeight(${index}, this.value)">
                        <span class="weight-num">${weight}w</span>
                    </div>
                    <div class="option-actions">
                        <button class="btn-sub-trigger" onclick="triggerDirectSpin(${index}, '${escapeQuotes(opt)}')">⚡ Sofort Drehen</button>
                        <button class="btn-sub-trigger trap-btn" onclick="armMainTrap(${index}, '${escapeQuotes(opt)}')">🎯 PC-Klick Falle</button>
                    </div>
                `;
                optionsList.appendChild(card);
            });
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function updateWeight(index, val) {
            optionWeights[index] = parseInt(val);
            renderOptionsUI();
        }

        function setAllWeights(val) {
            optionWeights = optionWeights.map(() => val);
            renderOptionsUI();
            vibrate(30);
            showToast(`Alle Gewichte auf ${val} gesetzt`);
        }

        function lockFirstOption() {
            if (optionWeights.length > 0) {
                optionWeights[0] = 0;
                renderOptionsUI();
                vibrate(40);
                showToast(`Ziel #1 auf 0% gesetzt!`);
            }
        }

        function forceFirstOption() {
            if (optionWeights.length > 0) {
                optionWeights = optionWeights.map((_, i) => i === 0 ? 100 : 0);
                renderOptionsUI();
                vibrate([40, 40, 40]);
                showToast(`Ziel #1 erzwungen (100%)!`);
            }
        }

        function randomizeWeights() {
            optionWeights = optionWeights.map(() => Math.floor(Math.random() * 100) + 1);
            renderOptionsUI();
            vibrate(50);
            showToast(`Gewichte zufällig durchgemischt!`);
        }

        // --- MANIPULATION 1: SOFORTIGE DREHUNG VOM HANDY ---
        function triggerDirectSpin(targetIndex, label) {
            socket.emit('remote_spin', { room: roomName, targetIndex: targetIndex });
            vibrate(60);
            showToast(`🚀 Drehe direkt auf: "${label}"`);
        }

        // --- MANIPULATION 2: GEWICHTETER ZUFALL (Handy berechnet Chance) ---
        weightedSpinBtn.addEventListener('click', () => {
            const totalWeight = optionWeights.reduce((a, b) => a + b, 0);
            if (totalWeight === 0) {
                showToast('❌ Alle Gewichte sind 0!');
                vibrate([100, 50, 100]);
                return;
            }

            let random = Math.random() * totalWeight;
            let selectedIndex = 0;

            for (let i = 0; i < optionWeights.length; i++) {
                if (random < optionWeights[i]) {
                    selectedIndex = i;
                    break;
                }
                random -= optionWeights[i];
            }

            triggerDirectSpin(selectedIndex, currentOptions[selectedIndex]);
        });

        // Normaler 100% Zufall
        randomSpinBtn.addEventListener('click', () => {
            socket.emit('remote_spin', { room: roomName, targetIndex: undefined });
            vibrate(60);
            showToast('🎲 Echten Zufall gedreht!');
        });

        // --- MANIPULATION 3: PC-KLICK FALLE SCHARFSCHALTEN ---
        function armMainTrap(index, label) {
            forcedMainTarget = index;
            trapDisplay.textContent = `#${index + 1} "${label}"`;
            trapDisplay.style.color = '#38bdf8';
            trapCard.classList.add('active');
            clearTrapBtn.style.display = 'block';

            // Sendet das erzwungene Ziel an das Hauptrad (PC) im aktuellen Raum
            socket.emit('set_forced_main_target', { room: roomName, targetIndex: index });

            renderOptionsUI();
            vibrate([50, 50, 50]); // Doppel-Vibration
            showToast(`🎯 PC-Klick präpariert auf: "${label}"`);
        }

        function clearMainTrap() {
            forcedMainTarget = null;
            trapDisplay.textContent = '🎲 Echter Zufall';
            trapDisplay.style.color = '#ffffff';
            trapCard.classList.remove('active');
            clearTrapBtn.style.display = 'none';

            socket.emit('set_forced_main_target', { room: roomName, targetIndex: -1 });
            renderOptionsUI();
        }

        clearTrapBtn.addEventListener('click', () => {
            clearMainTrap();
            vibrate(30);
            showToast('Falle entfernt!');
        });

        // --- LIVE EFFEKTE ---
        function triggerEffect(effectName) {
            socket.emit('trigger_sfx', { room: roomName, effect: effectName });
            vibrate(40);
            showToast(`💥 Effekt "${effectName}" gesendet!`);
        }

        // Vibration Helper
        function vibrate(pattern = 60) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        // Toast Helper
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2200);
        }
    </script>
</body>
</html>
